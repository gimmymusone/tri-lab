<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meat Crew — Locandina QR</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Libre+Franklin:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#1d1d1b;color:#f6efe3;font:16px/1.4 'Libre Franklin',sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
.card{width:min(100%,380px);aspect-ratio:3/4;background:#c91315;border-radius:24px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:#fff}
.wm{font:400 52px/.9 'Archivo Black',sans-serif;text-transform:uppercase}.wm i{font-style:normal;color:#d9b52a}
h1{font:400 30px/1 'Archivo Black',sans-serif;text-transform:uppercase}
.qr{background:#fff;border-radius:16px;padding:14px;width:62%}.qr svg{display:block;width:100%;height:auto}
p{font-size:15px}b{color:#d9b52a}
@media print{body{background:#fff;padding:0}.card{box-shadow:none}}
</style></head><body>
<div class="card">
  <img src="brand/logo-esteso_su-nero.svg" alt="Meat Crew" style="background:#f6efe3;border-radius:14px;padding:8px 14px;width:200px;height:auto">
  <h1>Com'è andata?</h1>
  <div class="qr" id="qr"></div>
  <p>Inquadra, lascia una recensione<br>e ricevi <b>100 punti</b> con la Crew Card</p>
</div>
<script src="qr.js"></script>
<script>
  var u=new URL('./',location.href).href,q=qrcode(0,'M');
  q.addData(u);q.make();
  document.getElementById('qr').innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});
</script>
</body></html>
