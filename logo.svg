  <defs>
    <clipPath id="a"><polygon points="302.2,347.55 245,314.75 290.6,234.95 347.8,267.75"/></clipPath>
    <clipPath id="b"><polygon points="509.4,347.55 452.2,314.75 497.8,234.95 555,267.75"/></clipPath>
  </defs>
  <g fill="none" stroke-linejoin="miter" stroke-linecap="butt" stroke-miterlimit="10">
    <path d="M250 210L410 490L90 490Z" stroke="#FFFFFF" stroke-width="46"/><path d="M250 210L410 490L90 490Z" stroke="#111111" stroke-width="40"/>
    <path d="M400 110L560 390L240 390Z" stroke="#FFFFFF" stroke-width="46"/><path d="M400 110L560 390L240 390Z" stroke="#19E67C" stroke-width="40"/>
    <path d="M550 210L710 490L390 490Z" stroke="#FFFFFF" stroke-width="46"/><path d="M550 210L710 490L390 490Z" stroke="#FF3B30" stroke-width="40"/>
    <g clip-path="url(#a)"><path d="M250 210L410 490L90 490Z" stroke="#FFFFFF" stroke-width="46"/><path d="M250 210L410 490L90 490Z" stroke="#111111" stroke-width="40"/></g>
    <g clip-path="url(#b)"><path d="M400 110L560 390L240 390Z" stroke="#FFFFFF" stroke-width="46"/><path d="M400 110L560 390L240 390Z" stroke="#19E67C" stroke-width="40"/></g>
